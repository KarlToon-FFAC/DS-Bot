border-bottom:0}.task-row .tiny{color:var(--bt-ink-2);margin-top:4px}.task-row .state{font-size:12px;white-space:nowrap}.state.waiting{color:var(--bt-warn)}.state.done{color:var(--bt-green)}.state.running{color:var(--bt-accent)}.chevron{font-size:17px;color:var(--bt-ink-3)}dialog{border:.5px solid var(--bt-line-2);border-radius:16px;box-shadow:0 14px 56px var(--bt-shadow);padding:0;width:min(1060px,calc(100vw - 48px));height:min(820px,calc(100dvh - 64px));max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);color:var(--bt-ink);background:var(--bt-main);overflow:hidden}dialog::backdrop{background:var(--bt-backdrop)}.modal-shell{display:flex;flex-direction:column;height:100%;min-height:0}.modal-head{padding:16px 20px 0;background:var(--bt-card);border-bottom:1px solid var(--bt-line)}.modal-top{display:flex;align-items:center;gap:8px;min-width:0}.modal-heading{min-width:0;flex:1}.modal-heading p{margin-top:4px;color:var(--bt-ink-2);font-size:12px;line-height:16px}.back-button{font-size:13px;padding:6px;border-radius:6px;white-space:nowrap}.close-button{font-size:22px;width:32px;height:32px;border-radius:7px;color:var(--bt-ink-2)}#modal-body{padding:18px 24px;overflow:auto;min-height:0;flex:1}.modal-footer{flex-shrink:0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.detail-item{border:1px solid var(--bt-line);border-radius:8px;background:var(--bt-card);padding:12px}.detail-item .small{color:var(--bt-ink-2);margin-bottom:5px}.detail-item p{font-size:13px;overflow-wrap:anywhere}.detail-note{border-left:3px solid var(--bt-accent);padding:10px 12px;background:var(--bt-bubble);font-size:12px;line-height:18px;margin:14px 0}.detail-note.warning{border-left-color:var(--bt-warn)}.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.run-card{width:100%;text-align:left;padding:12px;border:1px solid var(--bt-line);border-radius:8px;background:var(--bt-card);margin-top:8px}.run-card .row{display:flex;gap:8px;justify- <body>
<div class="prototype"><span>设计原型 · 虚构状态 · 未连接 Hub · 所有操作仅预览</span><button id="reset-view">恢复初始视图</button></div>
<div class="app">
<aside class="left" aria-label="群聊列表"><div class="brand"><b class="logo">DS</b><span>DS Bot</span></div><div class="section-label">群聊</div><button class="group-item active" data-action="main" data-view="messages"><i class="group-icon">协</i><span><strong>产品协作群</strong><small class="small">3 个话题 · 4 项任务</small></span></button><button class="group-item" data-action="placeholder"><i class="group-icon">研</i><span><strong>研发讨论</strong><small class="small">示例群 · 未展开</small></span></button><button class="group-item" data-action="placeholder"><i class="group-icon">测</i><span><strong>测试协作</strong><small class="small">示例群 · 未展开</small></span></button><div class="left-footer"><div class="tiny muted">当前在远程通信</div><button data-action="placeholder">⌂ <span>返回本地对话</span></button></div></aside>
<main class="main"><header class="group-head"><div class="head-row"><h1>产品协作群</h1><div class="head-actions"><button class="icon-button" data-action="info" aria-label="群信息" title="群信息">ⓘ</button></div></div><p class="small muted">2 位联系人 · 3 个 Bot · 2 项执行中，1 项等待</p><nav class="tabs" role="tablist" aria-label="群内视图"><button id="tab-messages" class="tab" role="tab" aria-selected="true" data-action="main" data-view="messages">消息</button><button id="tab-topics" class="tab" role="tab" aria-selected="false" data-action="main" data-view="topics">话题<span class="count">3</span></button><button id="tab-tasks" class="tab" role="tab" aria-selected="false" data-action="main" data-view="tasks">任务<span class="count">4</span></button></nav></header><section id="main-content" role="tabpanel" aria-label="群内内容"></section><div id="main-composer" class="composer"><div class="compose-context">发送到：产品协作群 <span class="tiny">· 新话题或明确回复已有话题</span></div><div class="compose-box"><textarea id="main-input" aria-label="群消息草稿" placeholder="说点什么，或 @Bot 派活…"></textarea><div class="compose-bottom"><span class="tiny muted">预览不会发送消息</span><button class="btn primary" data-action="preview-send">预览发送</button></div></div></div></main>
<aside class="right" id="right-info" aria-label="群信息与成员"></aside>
</div>
<dialog id="details" aria-labelledby="modal-title"><div class="modal-shell"><header class="modal-head"><div class="modal-top"><button id="modal-back" class="back-button hidden" data-action="back">← 返回</button><div class="modal-heading"><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button id="modal-close" class="close-button" data-action="close" aria-label="关闭详情">×</button></div><p class="modal-prototype">设计预览 · 不读取或改变真实状态</p><p id="modal-feedback" class="modal-feedback" role="status" aria-live="polite"></p><div id="topic-context" class="topic-context hidden"></div><nav id="modal-tabs" class="tabs" role="tablist" aria-label="话题详情视图"></nav></header><section id="modal-body"></section><div id="modal-footer" class="modal-footer"></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const topics={incident:{name:'接口故障',summary:'A 协调排查，B 查日志，C 回归检查。',status:'1 已完成 · 1 等待 · 1 执行中',participants:'用户甲、A、B、C'},release:{name:'上线公告',summary:'用户乙请 A 根据已确认范围撰写公告。',status:'1 执行中',participants:'用户乙、A'},chat:{name:'闲聊与约定',summary:'约定讨论方式；不产生工作任务。',status:'无工作任务',participants:'用户甲、用户乙'}};

function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function stateTag(task){return '<span class="state '+task.state+'">'+task.stateText+'</span>';}
function messageHtml(m,inTopic){const parent=messages.find(p=>p.id===m.replyTo);const quote=parent?'<button class="reply-quote" data-action="quoted" data-topic="'+m.topic+'" data-message="'+parent.id+'"><strong>回复 '+esc(parent.actor)+'：</strong>'+esc(parent.text)+'</button>':'';return '<article class="message '+(m.human?'human':'')+'" data-message="'+m.id+'"><div class="avatar '+(m.human?'human':'')+'">'+esc(m.actor.slice(-1))+'</div><div class="message-body"><div class="message-head"><span class="sender">'+esc(m.actor)+'</span><time class="time">'+m.time+'</time><button class="topic-tag" data-action="topic" data-topic="'+m.topic+'">'+topics[m.topic].name+'</button></div>'+quote+'<div class="bubble">'+esc(m.text)+'</div><div class="message-actions">'+(m.task?'<button class="text-button status '+m.state+'" data-action="task" data-task="'+m.task+'">'+esc(m.badge)+'</button>':'')+'<button class="text-button" data-action="'+(inTopic?'reply':'topic')+'" data-topic="'+m.topic+'" data-message="'+m.id+'">'+(inTopic?'回复这条':m.replies?'查看回复 '+m.replies:'查看话题')+'</button></div></div></article>';}
function taskList(ids){return '<div class="task-list">'+ids.map(id=>{const t=tasks[id];return '<button class="task-row" data-action="task" data-task="'+id+'"><span><strong>'+esc(t.name)+'</strong><span class="tiny" style="display:block">'+topics[t.topic].name+' · '+(t.parent?'子任务，归属 '+t.parent:'独立任务')+'</span></span><span>'+t.actor+'</span>'+stateTag(t)+'<span class="chevron">›</span></button>';}).join('')+'</div>';}

function renderMain(){document.querySelectorAll('[data-action="main"][role="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===mainView)));$('main-composer').classList.toggle('hidden',mainView!=='messages');if(mainView==='messages')$('main-content').innerHTML='<p class="day-label">今天 · 公开消息按时间排列</p>'+messages.map(m=>messageHtml(m,false)).join('');if(mainView==='topics')$('main-content').innerHTML='<p class="list-intro">话题是对话链在界面上的名称。点消息的“查看回复”或话题标签，都进入同一个话题详情。</p>'+Object.entries(topics).map(([id,t])=>'<button class="topic-card" data-action="topic" data-topic="'+id+'"><span class="row"><h3>'+t.name+'</h3><span class="chevron">›</span></span><p>'+t.summary+'</p><p>'+t.participants+' · '+t.status+'</p></button>').join('');if(mainView==='tasks')$('main-content').innerHTML='<p class="list-intro">任务跨话题集中查看。点开任务后，再查看它的一次或多次执行记录。</p>'+taskList(Object.keys(tasks));$('main-content').scrollTop=0;}
function open(state,push=false){if(!$('details').open){lastFocus=document.activeElement;history=[];$('details').showModal();}else if(push&&modalState)history.push({state:{...modalState,scrollTop:$('modal-body').scrollTop},focus:{...document.activeElement.dataset}});else if(!push)history=[];modalState=state;renderModal();}
function back(){if(history.length){const previous=history.pop();modalState=previous.state;renderModal();requestAnimationFrame(()=>{const candidates=$('details').querySelectorAll('[data-action]');const target=Array.from(candidates).find(el=>Object.entries(previous.focus).every(([key,value])=>el.dataset[key]===value));if(target)target.focus();});}else close();}

function composer(topic,replyTo){const target=replyTo?messages.find(m=>m.id===replyTo):null;return '<div class="composer"><div class="compose-context"><strong>发送到话题：'+topics[topic].name+'</strong><label>· 引用 <select id="reply-target" aria-label="选择引用消息"><option value="">不引用具体消息</option>'+messages.filter(m=>m.topic===topic).map(m=>'<option value="'+m.id+'"'+(target&&target.id===m.id?' selected':'')+'>'+esc(m.actor+'：'+m.text.slice(0,22)+(m.text.length>22?'…':''))+'</option>').join('')+'</select></label></div><div class="compose-box"><textarea id="topic-input" aria-label="话题消息草稿" placeholder="继续这个话题；不会混入其它话题…">'+esc(topicDrafts[topic]||'')+'</textarea><div class="compose-bottom"><span class="tiny muted">群消息对群可见；处理对象由 @ 或已绑定任务确定。预览不会发送。</span><button class="btn primary" data-action="preview-send">预览发送</button></div></div></div>';}

function renderModal(){$('modal-feedback').textContent='';const s=modalState;const tabs=$('modal-tabs'),body=$('modal-body'),footer=$('modal-footer');$('topic-context').classList.toggle('hidden',s.mode!=='topic');$('topic-context').innerHTML='';tabs.innerHTML='';footer.innerHTML='';$('modal-back').classList.toggle('hidden',history.length===0);if(s.mode==='topic'){const t=topics[s.topic];const root=messages.find(m=>m.topic===s.topic);$('topic-context').innerHTML='<p><strong>原问题 · '+esc(root.actor)+'：</strong>'+esc(root.text)+'</p><p class="muted">'+(s.topic==='incident'?'工作：A 等待 B 的日志结果 · C 的回归结果已返回。':s.topic==='release'?'工作：A 正在撰写公告 · 公开结果尚未提交。':'交流话题，没有工作任务。')+'</p>';$('modal-title').textContent='话题详情 · '+t.name;$('modal-subtitle').textContent='原“回复链”入口在此展开为完整话题 · '+t.participants;tabs.innerHTML=[['messages','消息'],['graph','协作图'],['tasks','任务']].map(([id,label])=>'<button class="tab" role="tab" aria-selected="'+(s.tab===id)+'" data-action="topic-tab" data-tab="'+id+'">'+label+'</button>').join('');if(s.tab==='messages')body.innerHTML=messages.filter(m=>m.topic===s.topic).map(m=>messageHtml(m,true)).join('');if(s.tab==='graph')body.innerHTML=s.topic==='incident'?graph():'<div class="detail-note">这个话题目前没有多 Bot 分叉。公开消息之间的回复关系仍保留在消息列表中。</div>'+messages.filter(m=>m.topic===s.topic).map(m=>messageHtml(m,true)).join('');if(s.tab==='tasks'){const ids=Object.values(tasks).filter(t=>t.topic===s.topic).map(t=>t.id);body.innerHTML=ids.length?'<p class="list-intro">同一个话题可包含多项任务；任务不会因为 Bot 暂时等待而消失。</p>'+taskList(ids):'<div class="detail-note">这个话题只有交流，没有工作任务。不强行把闲聊变成派单。</div>';}footer.innerHTML=composer(s.topic,s.replyTo);}else if(s.mode==='task'){const t=tasks[s.task];$('modal-title').textContent=t.name;$('modal-subtitle').textContent='任务 '+t.id+' · '+topics[t.topic].name+' · '+t.actor+' 负责';body.innerHTML='<p>'+t.description+'</p><div class="detail-grid">'+detailItem('任务状态',stateTag(t))+detailItem('发起 / 授权',esc(t.owner))+detailItem('依赖关系',esc(t.dependency))+detailItem('公开结果',esc(t.result))+'</div><button class="text-button" data-action="topic" data-topic="'+t.topic+'">查看所属话题：'+topics[t.topic].name+' →</button><div class="detail-note">'+(t.id==='T1'?'任务正在等待，执行回合已经结束。A 可以继续处理公告任务 T3；收到 T2 结果后再安排汇总回合。':t.id==='T3'?'A 的接口排查任务 T1 在等待依赖，当前只运行公告任务 T3。任务并存不表示同一个 Bot 同时执行两轮。':'以下只显示此任务的执行状态与被授权的公开摘要。')+'</div><h3>执行记录 · '+t.runs.length+' 次</h3>'+t.runs.map((r,i)=>'<button class="run-card" data-action="run" data-task="'+t.id+'" data-run="'+i+'"><span class="row"><strong>第 '+(i+1)+' 次执行 · '+r.id+'</strong><span class="chevron">›</span></span><p>'+r.state+' · '+r.trigger+'</p></button>').join('')+'<div class="action-row"><button class="btn" data-action="task-action" data-task="'+t.id+'" data-operation="supplement">补充这项任务</button>'+(t.state!=='done'?'<button class="btn danger" data-action="task-action" data-task="'+t.id+'" data-operation="cancel">取消这项任务</button>':'')+'</div>';}else if(s.mode==='run'){const t=tasks[s.task],r=t.runs[s.run];$('modal-title').textContent='执行记录 · '+r.id;$('modal-subtitle').textContent=t.id+' '+t.name+' · '+t.actor+' · 第 '+(Number(s.run)+1)+' 次执行';body.innerHTML='<div class="detail-grid">'+detailItem('本次状态',esc(r.state))+detailItem('触发来源',esc(r.trigger))+'</div><div class="flow-output"><h3>被授权的公开输出</h3><p>'+esc(r.output)+'</p></div><div class="detail-note">'+esc(r.note)+'</div><p class="small muted">这里只展示公开摘要和必要执行状态。不提供模型思考、内部笔记、私密草稿或本地文件内容。</p>';}else if(s.mode==='confirm'){const t=tasks[s.task],cancel=s.operation==='cancel';$('modal-title').textContent=cancel?'取消任务 · 确认目标':'补充任务 · 确认目标';$('modal-subtitle').textContent='示例确认卡，提交不会改变任何状态';body.innerHTML='<div class="confirm-card"><h2>'+t.id+' · '+t.name+'</h2><p><strong>所属话题：</strong>'+topics[t.topic].name+'<br><strong>负责 Bot：</strong>'+t.actor+'<br><strong>当前状态：</strong>'+t.stateText+'<br><strong>发起 / 授权：</strong>'+t.owner+'</p><div class="detail-note warning">'+(cancel?'正式产品会验证当前操作者的控制权。取消只阻止后续工作；已执行命令和已公开消息不会自动撤回。':'正式产品会验证任务控制权与当前版本。补充只能进入这项任务，不会改写同一 Bot 在另一个话题里的任务。')+'</div>'+(!cancel?'<label for="supplement-text">补充内容（仅此设计稿）</label><textarea id="supplement-text" placeholder="例如：请加上 09:30 之后的日志范围。"></textarea>':'')+'<div class="action-row"><button class="btn" data-action="back">返回，不操作</button><button class="btn '+(cancel?'danger':'primary')+'" data-action="confirm-preview">预览'+(cancel?'取消':'补充')+'请求</button></div></div>';}else if(s.mode==='actor'){const ids=Object.values(tasks).filter(t=>t.actor===s.actor).map(t=>t.id);$('modal-title').textContent=s.actor+' 的群内任务';$('modal-subtitle').textContent='按任务显示状态；不会把“等待”误报为仍在执行';body.innerHTML=taskList(ids);}else if(s.mode==='profile'){const profiles={A:{owner:'用户甲',role:'协作协调',skills:'任务拆分、依赖汇总、公告撰写',background:'负责在群内组织跨 Bot 协作，将各方结果整理为便于审阅的公开说明。'},B:{owner:'用户乙',role:'问题排查',skills:'日志分析、错误定位、排查报告',background:'负责根据已授权的数据与任务范围定位问题，向原话题提交排查结果。'},C:{owner:'用户甲',role:'测试验证',skills:'回归测试、复现步骤、结果验证',background:'负责关键流程回归与问题复现，提供可供群成员核对的测试结论。'}};const p=profiles[s.actor];$('modal-title').textContent=s.actor+' · 公开资料';$('modal-subtitle').textContent='成员公开资料示例，不包含本地私密配置或文件';body.innerHTML='<div class="profile-summary"><span class="avatar">'+s.actor+'</span><div><h2>'+s.actor+' · '+p.role+'</h2><p class="small muted">来自联系人：'+p.owner+'</p></div></div><div class="detail-grid">'+detailItem('所属联系人',p.owner)+detailItem('角色',p.role)+detailItem('技能与特长',p.skills)+detailItem('背景介绍',p.background)+'</div><button class="btn" data-action="actor" data-actor="'+s.actor+'">查看本群任务</button>';}else if(s.mode==='info'){$('modal-title').textContent='群信息';$('modal-subtitle').textContent='产品协作群 · 2 位联系人、3 个 Bot';body.innerHTML=groupInfo();}body.scrollTop=s.scrollTop||0;requestAnimationFrame(()=>{const anchor=s.mode==='topic'&&s.tab==='messages'&&s.anchor?body.querySelector('[data-message="'+s.anchor+'"].message'):null;if(anchor){anchor.classList.add('focused');anchor.scrollIntoView({block:'center'});}const focus=body.querySelector('button,textarea')||tabs.querySelector('[aria-selected=true]')||$('modal-close');focus.focus({preventScroll:true});});}
function reset(){if($('details').open)close();mainView='messages';$('main-input').value='';for(const key of Object.keys(topicDrafts))delete topicDrafts[key];for(const key of Object.keys(topicReferences))delete topicReferences[key];$('toast').textContent='';clearTimeout(toastTimer);renderMain();$('tab-messages').focus();}
$('reset-view').addEventListener('click',reset);
$('details').addEventListener('cancel',e=>{e.preventDefault();back();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='main'){mainView=b.dataset.view;renderMain();}if(a==='topic'){const within=$('details').open;open({mode:'topic',topic:b.dataset.topic,tab:'messages',replyTo:topicReferences[b.dataset.topic]||null,anchor:b.dataset.message||null},within&&modalState.mode!=='topic');}if(a==='topic-tab'){modalState.tab=b.dataset.tab;renderModal();}if(a==='task')open({mode:'task',task:b.dataset.task},$('details').open);if(a==='run')open({mode:'run',task:b.dataset.task,run:Number(b.dataset.run)},true);if(a==='task-action')open({mode:'confirm',task:b.dataset.task,operation:b.dataset.operation},true);if(a==='quoted'){if(modalState?.mode==='topic'&&modalState.topic===b.dataset.topic){modalState.anchor=b.dataset.message;modalState.tab='messages';renderModal();}else open({mode:'topic',topic:b.dataset.topic,tab:'messages',replyTo:topicReferences[b.dataset.topic]||null,anchor:b.dataset.message},$('details').open);}if(a==='reply'){topicReferences[modalState.topic]=b.dataset.message;modalState.replyTo=b.dataset.message;renderModal();requestAnimationFrame(()=>$('topic-input').focus());}if(a==='back')back();if(a==='close')close();if(a==='info')open({mode:'info'});if(a==='actor')open({mode:'actor',actor:b.dataset.actor},$('details').open);if(a==='profile')open({mode:'profile',actor:b.dataset.actor},$('details').open);if(a==='preview-send'){const topic=$('details').open&&modalState.mode==='topic'?topics[modalState.topic].name:'群中新话题';toast('仅展示发送目标：'+topic+'。设计稿没有发送消息，也没有启动 Bot。');}if(a==='confirm-preview'){const t=tasks[modalState.task];toast('仅预览请求目标：'+t.id+' '+t.name+'。未提交请求，任务状态保持不变。');}if(a==='placeholder')toast('此处是设计示例入口，未连接真实群或本地会话。');});
document.addEventListener('input',e=>{if(e.target.id==='topic-input'&&modalState?.mode==='topic')topicDrafts[modalState.topic]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='reply-target'&&modalState?.mode==='topic'){topicReferences[modalState.topic]=e.target.value||null;modalState.replyTo=e.target.value||null;$('modal-footer').innerHTML=composer(modalState.topic,modalState.replyTo);$('reply-target').focus();}});
$('right-info').innerHTML=groupInfo();renderMain();
</script>
